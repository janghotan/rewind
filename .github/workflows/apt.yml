name: APT repository

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish static .debs to the APT repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'rewind-*-unknown-linux-musl.tar.gz' \
            --dir dist
          ls -lh dist

      - name: Extract binaries
        run: |
          set -euo pipefail
          mkdir -p pkgs
          for archive in dist/*.tar.gz; do
            tar -xzf "$archive" -C pkgs
          done
          find pkgs -name rewind -type f -exec file {} \;

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg

      - name: Build static packages
        run: |
          set -euo pipefail
          host=$(find pkgs -path '*x86_64*' -name rewind -type f | head -1)
          arm=$(find pkgs -path '*aarch64*' -name rewind -type f | head -1)
          [[ -n $host && -n $arm ]]
          rm -rf apt-debs
          REWIND_HOST_BIN="$host" ./packaging/build-static-deb.sh "$host" amd64 apt-debs
          REWIND_HOST_BIN="$host" ./packaging/build-static-deb.sh "$arm" arm64 apt-debs
          ls -lh apt-debs

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          echo "Signing with $fingerprint"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Configure deploy key
        env:
          APT_DEPLOY_KEY: ${{ secrets.APT_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$APT_DEPLOY_KEY" > ~/.ssh/apt_deploy
          chmod 600 ~/.ssh/apt_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            IdentityFile ~/.ssh/apt_deploy
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Publish repository
        run: |
          set -euo pipefail
          git clone --depth 1 --branch gh-pages git@github.com:janghotan/apt.git apt-repo
          cd apt-repo
          git config user.name "rewind release bot"
          git config user.email "janghotan@users.noreply.github.com"
          ./publish.sh "$GITHUB_WORKSPACE"/apt-debs/*.deb
          git add -A
          if git diff --cached --quiet; then
            echo "APT repository already up to date"
            exit 0
          fi
          git commit -m "apt: publish ${{ inputs.tag }}"
          git push origin gh-pages

      - name: Attach .debs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" apt-debs/*.deb \
            --repo "$GITHUB_REPOSITORY" --clobber
