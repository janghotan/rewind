name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build static binary
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="rewind-${version}-${{ matrix.target }}"
          archive="rewind-${{ matrix.target }}.tar.gz"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/rewind" "dist/${name}/"
          cp README.md LICENSE CHANGELOG.md "dist/${name}/"
          mkdir -p "dist/${name}/shell"
          cp shell/bash.sh shell/zsh.sh shell/fish.fish "dist/${name}/shell/"
          tar -C dist -czf "dist/${archive}" "${name}"
          sha256sum "dist/${archive}" > "dist/${archive}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rewind-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm -f *.sha256

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: rewind ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
