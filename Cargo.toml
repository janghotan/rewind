[package]
name = "rewind"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Universal undo for destructive shell commands (rm, mv, cp, chmod, chown, git)"
license = "MIT"
repository = "https://github.com/janghotan/rewind"
homepage = "https://github.com/janghotan/rewind"
documentation = "https://github.com/janghotan/rewind#readme"
readme = "README.md"
keywords = ["undo", "trash", "shell", "cli", "recovery"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["packaging/*.tar.gz", "debian/rewind/*"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
filetime = "0.2.29"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
